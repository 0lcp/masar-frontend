<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مسار - تسجيل الدخول وإنشاء حساب</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0914;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background-color: #1a1528;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-card h1 {
            color: #ff5252;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .auth-card p.subtitle {
            color: #a0a0b0;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #332a48;
            background-color: #0d0914;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ff5252;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #e04343;
        }

        .alert-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background-color: rgba(255, 82, 82, 0.15);
            border: 1px solid #ff5252;
            color: #ff8888;
        }

        .alert-success {
            background-color: rgba(76, 175, 80, 0.15);
            border: 1px solid #4caf50;
            color: #81c784;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h1>منصة مسار</h1>
    <p class="subtitle">بوابتك للتعلم الذكي والنجاح</p>

    <div id="alertBox" class="alert-box"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="regEmail">البريد الإلكتروني</label>
            <input type="email" id="regEmail" placeholder="example@domain.com" required>
        </div>

        <button type="submit" id="btnSendOtp" class="btn-submit">إرسال رمز التحقق</button>
    </form>
</div>

<script>
    const API_BASE = 'https://masar-backend-qcpq.onrender.com/api/auth';
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const btnSendOtp = document.getElementById('btnSendOtp');

    function showAlert(message, isError = true) {
        alertBox.textContent = message;
        alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
        alertBox.style.display = 'block';
    }

    registerForm.addEventListener('submit', async function (e) {
        // منع إعادة تحميل الصفحة الافتراضية
        e.preventDefault();

        const emailInput = document.getElementById('regEmail');
        const email = emailInput.value.trim();

        if (!email) {
            showAlert('يرجى إدخال البريد الإلكتروني بشكل صحيح.');
            return;
        }

        btnSendOtp.disabled = true;
        btnSendOtp.textContent = 'جاري الإرسال...';
        alertBox.style.display = 'none';

        try {
            const response = await fetch(`${API_BASE}/send-otp`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ email: email })
            });

            const data = await response.json();

            if (response.ok) {
                showAlert(data.message || 'تم إرسال رمز التحقق بنجاح، تحقق من بريدك الإلكتروني.', false);
            } else {
                showAlert(data.error || data.message || 'حدث خطأ أثناء معالجة الطلب.');
            }
        } catch (error) {
            console.error('Fetch error:', error);
            showAlert('تعذر الاتصال بالسيرفر، تأكد من الاتصال بالإنتـرنت.');
        } finally {
            btnSendOtp.disabled = false;
            btnSendOtp.textContent = 'إرسال رمز التحقق';
        }
    });
</script>

</body>
</html>

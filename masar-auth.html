<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — تسجيل الدخول</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

:root {
  --ink: #1A1030;
  --panel: #241B3D;
  --panel-2: #2E2350;
  --gold: #FF6F5E;
  --gold-soft: #FF9587;
  --teal-soft: #6EE7B7;
  --text: #F7F3FF;
  --muted: #A79FC7;
  --line: rgba(247,243,255,0.09);
  --danger: #F43F5E;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  width: 100%;
  max-width: 400px;
  padding: 32px 28px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 24px;
  font-family: 'El Messiri', serif;
  font-weight: 700;
  margin-bottom: 24px;
}
.logo-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
}

.tabs {
  display: flex;
  background: var(--panel-2);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
}
.tab.active {
  background: var(--panel);
  color: var(--gold-soft);
}

.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
}
.form-group input, .form-group select {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  font-family: inherit;
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--gold);
}

.btn-submit {
  width: 100%;
  background: var(--gold);
  color: var(--ink);
  font-weight: 700;
  font-size: 15px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s;
}
.btn-submit:hover {
  opacity: 0.9;
}

.alert {
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 18px;
  display: none;
}
.alert.error {
  background: rgba(244, 63, 94, 0.15);
  color: #FB7185;
  border: 1px solid rgba(244, 63, 94, 0.3);
  display: block;
}
.alert.success {
  background: rgba(34, 176, 125, 0.15);
  color: var(--teal-soft);
  border: 1px solid rgba(34, 176, 125, 0.3);
  display: block;
}
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo"><span class="logo-dot"></span>منصة مسار</div>
  
  <div class="tabs">
    <div class="tab active" onclick="switchMode('login')">تسجيل الدخول</div>
    <div class="tab" onclick="switchMode('register')">حساب جديد</div>
  </div>

  <div id="alertBox" class="alert"></div>

  <form id="authForm" onsubmit="handleAuth(event)">
    <div class="form-group" id="nameGroup" style="display:none;">
      <label>الاسم الكامل</label>
      <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي">
    </div>

    <div class="form-group" id="gradeGroup" style="display:none;">
      <label>الصف الدراسي</label>
      <select id="grade">
        <option value="الثالث متوسط">الثالث متوسط</option>
        <option value="الرابع إعدادي">الرابع إعدادي</option>
        <option value="الخامس إعدادي">الخامس إعدادي</option>
        <option value="السادس إعدادي">السادس إعدادي</option>
      </select>
    </div>

    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" required placeholder="example@domain.com">
    </div>

    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">دخول</button>
  </form>
</div>

<script>
const API_BASE = 'https://masar-backend-qcpq.onrender.com/api/auth';
let mode = 'login';

function switchMode(newMode) {
  mode = newMode;
  const tabs = document.querySelectorAll('.tab');
  const nameGroup = document.getElementById('nameGroup');
  const gradeGroup = document.getElementById('gradeGroup');
  const submitBtn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');
  
  alertBox.className = 'alert';
  alertBox.style.display = 'none';

  if (mode === 'login') {
    tabs[0].classList.add('active');
    tabs[1].classList.remove('active');
    nameGroup.style.display = 'none';
    gradeGroup.style.display = 'none';
    submitBtn.textContent = 'دخول';
  } else {
    tabs[1].classList.add('active');
    tabs[0].classList.remove('active');
    nameGroup.style.display = 'block';
    gradeGroup.style.display = 'block';
    submitBtn.textContent = 'إنشاء الحساب';
  }
}

async function handleAuth(e) {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const fullName = document.getElementById('fullName').value.trim();
  const grade = document.getElementById('grade').value;

  alertBox.className = 'alert';
  alertBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'جاري التحميل...';

  const endpoint = mode === 'login' ? `${API_BASE}/login` : `${API_BASE}/register`;
  const payload = mode === 'login' 
    ? { email, password }
    : { email, password, full_name: fullName, grade };

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.error || 'حدث خطأ أثناء الاتصال بالخادم');
    }

    // حفظ التوكن والبيانات في localStorage
    localStorage.setItem('masar_token', data.token);
    if (data.user) {
      localStorage.setItem('masar_user', JSON.stringify(data.user));
    }

    alertBox.textContent = mode === 'login' ? 'تم تسجيل الدخول بنجاح! جاري التحويل...' : 'تم إنشاء الحساب بنجاح! جاري التحويل...';
    alertBox.className = 'alert success';

    // التحويل إلى صفحة الداش بورد
    setTimeout(() => {
      window.location.href = 'masar-dashboard.html';
    }, 1000);

  } catch (err) {
    alertBox.textContent = err.message;
    alertBox.className = 'alert error';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = mode === 'login' ? 'دخول' : 'إنشاء الحساب';
  }
}
</script>

</body>
</html>

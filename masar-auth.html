<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مسار - تسجيل الدخول وإنشاء حساب</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0914;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: #1a1528;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-header h1 {
            color: #ff5252;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #a0a0b0;
            font-size: 14px;
        }

        .tab-buttons {
            display: flex;
            background-color: #0d0914;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: #a0a0b0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: #ff5252;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #332a48;
            background-color: #0d0914;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ff5252;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #ff5252;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #e04343;
        }

        .btn-submit:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .alert-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .alert-error {
            background-color: rgba(255, 82, 82, 0.15);
            border: 1px solid #ff5252;
            color: #ff8888;
        }

        .alert-success {
            background-color: rgba(76, 175, 80, 0.15);
            border: 1px solid #4caf50;
            color: #81c784;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <h1>منصة مسار</h1>
        <p>بوابتك للتعلم الذكي والنجاح</p>
    </div>

    <div class="tab-buttons">
        <button type="button" class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
        <button type="button" class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <!-- نموذج تسجيل الدخول -->
    <div id="loginSection" class="form-section active">
        <form onsubmit="return false;">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="button" id="btnLogin" class="btn-submit">تسجيل الدخول</button>
        </form>
    </div>

    <!-- نموذج إنشاء حساب -->
    <div id="registerSection" class="form-section">
        <form onsubmit="return false;">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="example@domain.com" required>
            </div>
            <button type="button" id="btnSendOtp" class="btn-submit">إرسال رمز التحقق</button>
        </form>
    </div>
</div>

<script>
    const API_BASE = 'https://masar-backend-qcpq.onrender.com/api/auth';
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, isError = true) {
        alertBox.textContent = message;
        alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
        alertBox.style.display = 'block';
    }

    function switchTab(tab) {
        alertBox.style.display = 'none';
        const tabBtns = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.form-section');

        tabBtns.forEach(btn => btn.classList.remove('active'));
        sections.forEach(sec => sec.classList.remove('active'));

        if (tab === 'login') {
            tabBtns[0].classList.add('active');
            document.getElementById('loginSection').classList.add('active');
        } else {
            tabBtns[1].classList.add('active');
            document.getElementById('registerSection').classList.add('active');
        }
    }

    // إرسال رمز OTP
    document.getElementById('btnSendOtp').addEventListener('click', async function () {
        const btn = this;
        const email = document.getElementById('regEmail').value.trim();

        if (!email) {
            showAlert('يرجى إدخال البريد الإلكتروني بشكل صحيح.');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'جاري الإرسال...';
        alertBox.style.display = 'none';

        try {
            const response = await fetch(`${API_BASE}/send-otp`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ email: email })
            });

            const textData = await response.text();
            let data;
            try {
                data = JSON.parse(textData);
            } catch (e) {
                showAlert(`خطأ من السيرفر (${response.status}): تحقق من المسار أو لوجات Render.`);
                return;
            }

            if (response.ok) {
                showAlert(data.message || 'تم إرسال رمز التحقق بنجاح.', false);
            } else {
                showAlert(data.error || data.message || 'حدث خطأ أثناء الإرسال.');
            }
        } catch (error) {
            console.error('Fetch error:', error);
            showAlert('تعذر الاتصال بالسيرفر، تأكد من الاتصال بالإنتـرنت.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'إرسال رمز التحقق';
        }
    });
</script>

</body>
</html>

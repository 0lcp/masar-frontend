<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — اختبار</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

:root {
  --ink: #1A1030;
  --panel: #241B3D;
  --panel-2: #2E2350;
  --gold: #FF6F5E;
  --gold-soft: #FF9587;
  --teal: #22B07D;
  --teal-soft: #6EE7B7;
  --text: #F7F3FF;
  --muted: #A79FC7;
  --line: rgba(247,243,255,0.09);
  --danger: #F43F5E;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--ink); color: var(--text);
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  min-height: 100vh;
}
.display { font-family:'El Messiri', serif; font-weight:700; }

.topbar {
  position:sticky; top:0; z-index:20; background: rgba(26,16,48,0.92); backdrop-filter: blur(10px);
  border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center;
  justify-content:space-between; gap:12px;
}
.logo { display:flex; align-items:center; gap:8px; font-size:18px; }
.logo-dot { width:8px; height:8px; border-radius:50%; background: var(--gold); box-shadow:0 0 10px var(--gold); }
.back-link { color: var(--muted); font-size:13px; text-decoration:none; }
.back-link:hover { color: var(--text); }

.page { max-width:680px; margin:0 auto; padding:28px 20px 60px; }

.quiz-title { font-size:22px; margin-bottom:6px; }
.quiz-meta { color: var(--muted); font-size:13px; margin-bottom:28px; }

.question-card {
  background: var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px;
  margin-bottom:16px;
}
.question-num { font-size:12px; color: var(--gold-soft); margin-bottom:8px; }
.question-text { font-size:16px; margin-bottom:16px; line-height:1.6; }

.choice-row {
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:10px;
  border:1px solid var(--line); margin-bottom:8px; cursor:pointer; font-size:14px;
}
.choice-row:hover { border-color: var(--gold); }
.choice-row input { accent-color: var(--gold); width:16px; height:16px; flex-shrink:0; }
.choice-row.selected { background: var(--panel-2); border-color: var(--gold); }

/* result states */
.choice-row.correct { border-color: var(--teal); background: rgba(34,176,125,0.1); }
.choice-row.wrong { border-color: var(--danger); background: rgba(244,63,94,0.1); }

.btn-submit {
  width:100%; background: var(--gold); color: var(--ink); font-weight:700; font-size:15px;
  padding:14px; border-radius:12px; border:none; cursor:pointer; margin-top:10px;
}
.btn-submit:disabled { opacity:0.6; cursor:not-allowed; }

.result-box {
  background: var(--panel); border:1px solid var(--line); border-radius:20px; padding:32px 24px;
  text-align:center; margin-bottom:28px;
}
.result-box .pct { font-size:42px; font-family:'El Messiri',serif; color: var(--gold); margin-bottom:6px; }
.result-box .frac { color: var(--muted); font-size:14px; margin-bottom:18px; }
.result-box .btn-back {
  display:inline-block; background: var(--panel-2); color: var(--text); border:1px solid var(--line);
  font-size:13px; padding:11px 22px; border-radius:999px; text-decoration:none; margin-top:6px;
}

.state-box {
  background: var(--panel); border:1px solid var(--line); border-radius:16px; padding:40px 24px;
  text-align:center; color: var(--muted); font-size:14px;
}
.state-box .icon { font-size:32px; margin-bottom:12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="logo-dot"></span><span class="display">مسار</span></div>
  <a href="#" class="back-link" id="backLink">← رجوع للدرس</a>
</div>

<div class="page" id="page">
  <div class="state-box"><div class="icon">⏳</div>...جاري تحميل الاختبار</div>
</div>

<script>
const API_BASE = 'https://masar-backend.onrender.com/api';
const token = sessionStorage.getItem('masar_token');
const params = new URLSearchParams(location.search);
const lessonId = params.get('lesson');

let quiz = null;
const selectedAnswers = {}; // questionId -> choiceId

document.getElementById('backLink').href = `masar-lesson.html?lesson=${lessonId}`;

function renderState(icon, text) {
  document.getElementById('page').innerHTML = `<div class="state-box"><div class="icon">${icon}</div>${text}</div>`;
}

function renderQuiz() {
  const html = `
    <div class="quiz-title">${quiz.title}</div>
    <div class="quiz-meta">${quiz.questions.length} أسئلة — اختر إجابة وحدة لكل سؤال</div>
    ${quiz.questions.map((q, qi) => `
      <div class="question-card">
        <div class="question-num">سؤال ${qi + 1} من ${quiz.questions.length}</div>
        <div class="question-text">${q.text}</div>
        ${q.choices.map(c => `
          <label class="choice-row" id="choice-${q.id}-${c.id}" onclick="selectAnswer(${q.id}, ${c.id})">
            <input type="radio" name="q-${q.id}" value="${c.id}">
            <span>${c.text}</span>
          </label>
        `).join('')}
      </div>
    `).join('')}
    <button class="btn-submit" id="submitBtn" onclick="submitQuiz()">تسليم الاختبار</button>
  `;
  document.getElementById('page').innerHTML = html;
}

function selectAnswer(questionId, choiceId) {
  selectedAnswers[questionId] = choiceId;
  quiz.questions.find(q => q.id === questionId).choices.forEach(c => {
    document.getElementById(`choice-${questionId}-${c.id}`).classList.toggle('selected', c.id === choiceId);
  });
}

async function submitQuiz() {
  if (!token) { alert('لازم تسجل دخولك أول عشان تسلم الاختبار'); return; }

  const unanswered = quiz.questions.filter(q => !(q.id in selectedAnswers));
  if (unanswered.length) {
    alert(`لسه ماجاوبت على ${unanswered.length} سؤال`);
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '...جاري التصحيح';

  const answers = Object.entries(selectedAnswers).map(([question_id, choice_id]) => ({
    question_id: parseInt(question_id, 10), choice_id: parseInt(choice_id, 10),
  }));

  try {
    const res = await fetch(`${API_BASE}/quizzes/${quiz.id}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ answers }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || 'صار خطأ بالتصحيح');

    renderResult(data.attempt, data.breakdown);
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
    btn.textContent = 'تسليم الاختبار';
  }
}

function renderResult(attempt, breakdown) {
  const breakdownMap = {};
  breakdown.forEach(b => { breakdownMap[b.question_id] = b; });

  const questionsHtml = quiz.questions.map((q, qi) => {
    const b = breakdownMap[q.id];
    return `
      <div class="question-card">
        <div class="question-num">سؤال ${qi + 1}</div>
        <div class="question-text">${q.text}</div>
        ${q.choices.map(c => {
          let cls = '';
          if (c.id === b.correct_choice_id) cls = 'correct';
          else if (c.id === b.chosen_choice_id && !b.is_correct) cls = 'wrong';
          return `<div class="choice-row ${cls}">${c.text}</div>`;
        }).join('')}
      </div>
    `;
  }).join('');

  document.getElementById('page').innerHTML = `
    <div class="result-box">
      <div class="pct">${attempt.percent}٪</div>
      <div class="frac">جاوبت صح على ${attempt.score} من ${attempt.total} أسئلة</div>
      <a href="masar-lesson.html?lesson=${lessonId}" class="btn-back">رجوع للدرس</a>
    </div>
    ${questionsHtml}
  `;
}

async function init() {
  if (!lessonId) { renderState('⚠️', 'ماكو درس محدد.'); return; }

  try {
    const res = await fetch(`${API_BASE}/content/lessons/${lessonId}/quiz`, {
      headers: token ? { 'Authorization': `Bearer ${token}` } : {},
    });
    const data = await res.json();

    if (!res.ok) {
      renderState(res.status === 402 ? '🔒' : '❌', data.error || 'صار خطأ');
      return;
    }
    if (!data.quiz) {
      renderState('📭', 'ماكو اختبار لهذا الدرس بعد.');
      return;
    }

    quiz = data.quiz;
    renderQuiz();
  } catch (err) {
    renderState('❌', 'ما كدرنا نوصل للسيرفر.');
  }
}

init();
</script>

</body>
</html>

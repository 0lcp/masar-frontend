<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — تفعيل الحساب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

:root {
  --ink: #1A1030;
  --panel: #241B3D;
  --panel-2: #2E2350;
  --gold: #FF6F5E;
  --gold-soft: #FF9587;
  --teal: #22B07D;
  --teal-soft: #6EE7B7;
  --text: #F7F3FF;
  --muted: #A79FC7;
  --line: rgba(247,243,255,0.10);
  --danger: #F43F5E;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--ink); color: var(--text);
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.display { font-family:'El Messiri', serif; font-weight:700; }

.card {
  width:100%; max-width:420px; background: var(--panel); border:1px solid var(--line);
  border-radius:24px; padding:40px 32px; text-align:center;
}
.logo { display:flex; align-items:center; justify-content:center; gap:10px; font-size:22px; margin-bottom:28px; }
.logo-dot { width:10px; height:10px; border-radius:50%; background: var(--gold); box-shadow:0 0 14px var(--gold); }

.icon { font-size:44px; margin-bottom:18px; }
.icon.spin { animation: spin 1.2s linear infinite; display:inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

h1 { font-size:20px; margin-bottom:10px; }
p { color: var(--muted); font-size:14px; line-height:1.7; margin-bottom:24px; }

.btn {
  display:inline-block; background: var(--gold); color: var(--ink); font-weight:700; font-size:14px;
  padding:13px 28px; border-radius:12px; text-decoration:none;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span class="logo-dot"></span><span class="display">مسار</span></div>
  <div id="content">
    <div class="icon spin">⏳</div>
    <h1>...جاري تفعيل حسابك</h1>
    <p>لحظات وبس</p>
  </div>
</div>

<script>
const API_BASE = 'https://masar-backend-qcpq.onrender.com/api';
const token = new URLSearchParams(location.search).get('token');

async function verify() {
  const content = document.getElementById('content');

  if (!token) {
    content.innerHTML = `
      <div class="icon">⚠️</div>
      <h1>الرابط ناقص</h1>
      <p>هذا الرابط مو كامل. تأكد إنك ضاغط الرابط اللي وصلك بالإيميل كامل.</p>
      <a href="masar-auth.html" class="btn">رجوع لتسجيل الدخول</a>
    `;
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/auth/verify-email`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      content.innerHTML = `
        <div class="icon">❌</div>
        <h1>ما كدرنا نفعّل حسابك</h1>
        <p>${data.error || 'الرابط غير صحيح أو منتهي الصلاحية.'}</p>
        <a href="masar-auth.html" class="btn">رجوع لتسجيل الدخول</a>
      `;
      return;
    }

    content.innerHTML = `
      <div class="icon">🎉</div>
      <h1>تم تفعيل حسابك بنجاح!</h1>
      <p>هسه تكدر تسجل دخولك وتبدا مسارك.</p>
      <a href="masar-auth.html" class="btn">سجل دخولك</a>
    `;
  } catch (err) {
    content.innerHTML = `
      <div class="icon">❌</div>
      <h1>ما كدرنا نوصل للسيرفر</h1>
      <p>تأكد إن الباك اند شغّال وجرب مرة ثانية.</p>
      <a href="masar-auth.html" class="btn">رجوع لتسجيل الدخول</a>
    `;
  }
}

verify();
</script>

</body>
</html>

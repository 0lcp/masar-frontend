<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — تفعيل الحساب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

:root {
  --ink: #1A1030;
  --panel: #241B3D;
  --panel-2: #2E2350;
  --gold: #FF6F5E;
  --gold-soft: #FF9587;
  --teal: #22B07D;
  --teal-soft: #6EE7B7;
  --text: #F7F3FF;
  --muted: #A79FC7;
  --line: rgba(247,243,255,0.10);
  --danger: #F43F5E;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--ink); color: var(--text);
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.display { font-family:'El Messiri', serif; font-weight:700; }

.card {
  width:100%; max-width:420px; background: var(--panel); border:1px solid var(--line);
  border-radius:24px; padding:40px 32px; text-align:center;
}
.logo { display:flex; align-items:center; justify-content:center; gap:10px; font-size:22px; margin-bottom:28px; }
.logo-dot { width:10px; height:10px; border-radius:50%; background: var(--gold); box-shadow:0 0 14px var(--gold); }

.icon { font-size:44px; margin-bottom:18px; }

h1 { font-size:20px; margin-bottom:10px; }
p { color: var(--muted); font-size:14px; line-height:1.7; margin-bottom:24px; }

.field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; text-align:right; }
.field label { font-size:13px; color: var(--muted); }
.field input {
  background: var(--panel-2); border:1px solid var(--line); border-radius:12px;
  padding:13px 14px; color: var(--text); font-size:22px; font-family:inherit; outline:none;
  text-align:center; letter-spacing:8px;
}
.field input:focus { border-color: var(--gold); }

.btn {
  display:inline-block; width:100%; background: var(--gold); color: var(--ink); font-weight:700; font-size:14px;
  padding:13px 28px; border-radius:12px; border:none; cursor:pointer; text-decoration:none;
}
.btn:disabled { opacity:0.6; cursor:not-allowed; }

.msg { font-size:13px; border-radius:10px; padding:10px 12px; margin-bottom:16px; display:none; text-align:right; }
.msg.show { display:block; }
.msg.error { background: rgba(244,63,94,0.12); color:#FB7185; border:1px solid rgba(244,63,94,0.3); }
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span class="logo-dot"></span><span class="display">مسار</span></div>
  <div id="content">
    <div class="icon">⏳</div>
    <h1>...جاري التحميل</h1>
  </div>
</div>

<script>
const API_BASE = 'https://masar-backend-qcpq.onrender.com/api';
const email = new URLSearchParams(location.search).get('email');

function showMissingEmail() {
  document.getElementById('content').innerHTML = `
    <div class="icon">⚠️</div>
    <h1>الرابط ناقص</h1>
    <p>هذا الرابط مو كامل. رجعي لصفحة التسجيل وحاولي مرة ثانية.</p>
    <a href="masar-auth.html" class="btn">رجوع لتسجيل الدخول</a>
  `;
}

function showForm() {
  document.getElementById('content').innerHTML = `
    <div class="icon">📧</div>
    <h1>فعّلي حسابك</h1>
    <p>وصلك رمز تحقق مكوّن من 6 أرقام على<br><strong>${email}</strong></p>
    <form onsubmit="return submitVerify(event)">
      <div class="field">
        <input type="text" id="code" placeholder="000000" maxlength="6" inputmode="numeric" required>
      </div>
      <div class="msg" id="formMsg"></div>
      <button type="submit" class="btn" id="submitBtn">تفعيل الحساب</button>
    </form>
  `;
}

function showSuccess() {
  document.getElementById('content').innerHTML = `
    <div class="icon">🎉</div>
    <h1>تم تفعيل حسابك بنجاح!</h1>
    <p>هسه تكدر تسجل دخولك وتبدا مسارك.</p>
    <a href="masar-auth.html" class="btn">سجل دخولك</a>
  `;
}

async function submitVerify(e) {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  const msgEl = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');

  if (code.length !== 6) {
    msgEl.textContent = 'رمز التحقق لازم يكون 6 أرقام';
    msgEl.className = 'msg show error';
    return false;
  }

  btn.disabled = true; btn.textContent = '...جاري التفعيل';

  try {
    const res = await fetch(`${API_BASE}/auth/verify-email`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code }),
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      msgEl.textContent = data.error || 'الرمز غير صحيح أو منتهي الصلاحية.';
      msgEl.className = 'msg show error';
      btn.disabled = false;
      btn.textContent = 'تفعيل الحساب';
      return false;
    }

    showSuccess();
  } catch (err) {
    msgEl.textContent = 'ما كدرنا نوصل للسيرفر. جربي مرة ثانية.';
    msgEl.className = 'msg show error';
    btn.disabled = false;
    btn.textContent = 'تفعيل الحساب';
  }
  return false;
}

if (!email) {
  showMissingEmail();
} else {
  showForm();
}
</script>

</body>
</html>

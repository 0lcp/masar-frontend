<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — تعيين كلمة مرور جديدة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

:root {
  --ink: #1A1030;
  --panel: #241B3D;
  --panel-2: #2E2350;
  --gold: #FF6F5E;
  --gold-soft: #FF9587;
  --teal: #22B07D;
  --teal-soft: #6EE7B7;
  --text: #F7F3FF;
  --muted: #A79FC7;
  --line: rgba(247,243,255,0.10);
  --danger: #F43F5E;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--ink); color: var(--text);
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.display { font-family:'El Messiri', serif; font-weight:700; }

.card {
  width:100%; max-width:420px; background: var(--panel); border:1px solid var(--line);
  border-radius:24px; padding:40px 32px;
}
.logo { display:flex; align-items:center; justify-content:center; gap:10px; font-size:22px; margin-bottom:28px; }
.logo-dot { width:10px; height:10px; border-radius:50%; background: var(--gold); box-shadow:0 0 14px var(--gold); }

.icon { font-size:44px; margin-bottom:14px; text-align:center; }
h1 { font-size:20px; margin-bottom:8px; text-align:center; }
p.sub { color: var(--muted); font-size:14px; margin-bottom:24px; text-align:center; line-height:1.7; }

.field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label { font-size:13px; color: var(--muted); }
.field input {
  background: var(--panel-2); border:1px solid var(--line); border-radius:12px;
  padding:13px 14px; color: var(--text); font-size:15px; font-family:inherit; outline:none;
}
.field input:focus { border-color: var(--gold); }

.btn {
  width:100%; background: var(--gold); color: var(--ink); font-weight:700; font-size:15px;
  padding:14px; border-radius:12px; border:none; cursor:pointer; margin-top:8px;
}
.btn:disabled { opacity:0.6; cursor:not-allowed; }
.btn-link {
  display:block; text-align:center; margin-top:18px; background: var(--gold); color: var(--ink);
  font-weight:700; font-size:14px; padding:13px; border-radius:12px; text-decoration:none;
}

.msg { font-size:13px; border-radius:10px; padding:10px 12px; margin-top:12px; display:none; }
.msg.show { display:block; }
.msg.error { background: rgba(244,63,94,0.12); color:#FB7185; border:1px solid rgba(244,63,94,0.3); }
.msg.success { background: rgba(34,176,125,0.12); color: var(--teal-soft); border:1px solid rgba(34,176,125,0.3); }
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span class="logo-dot"></span><span class="display">مسار</span></div>
  <div id="content">
    <div class="icon">⏳</div>
    <h1>...جاري التحقق من الرابط</h1>
  </div>
</div>

<script>
const API_BASE = 'https://masar-backend-qcpq.onrender.com/api';
const token = new URLSearchParams(location.search).get('token');

function showInvalidToken() {
  document.getElementById('content').innerHTML = `
    <div class="icon">⚠️</div>
    <h1>الرابط غير صحيح</h1>
    <p class="sub">هذا الرابط ناقص أو منتهي الصلاحية. اطلب رابط استعادة جديد من صفحة تسجيل الدخول.</p>
    <a href="masar-auth.html" class="btn-link">رجوع لتسجيل الدخول</a>
  `;
}

function showForm() {
  document.getElementById('content').innerHTML = `
    <h1>عيّن كلمة مرور جديدة</h1>
    <p class="sub">اختر كلمة مرور قوية لحسابك</p>
    <form onsubmit="return submitReset(event)">
      <div class="field">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="newPass" placeholder="8 أحرف على الأقل" required>
      </div>
      <div class="field">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="confirmPass" placeholder="أعد كتابتها" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">تغيير كلمة المرور</button>
      <div class="msg" id="formMsg"></div>
    </form>
  `;
}

function showSuccess() {
  document.getElementById('content').innerHTML = `
    <div class="icon">✅</div>
    <h1>تم تغيير كلمة المرور</h1>
    <p class="sub">تكدر هسه تسجل دخولك بكلمة المرور الجديدة</p>
    <a href="masar-auth.html" class="btn-link">سجل دخولك</a>
  `;
}

async function submitReset(e) {
  e.preventDefault();
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  const msgEl = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');

  if (newPass.length < 8) {
    msgEl.textContent = 'كلمة المرور لازم تكون 8 أحرف أو أكثر';
    msgEl.className = 'msg show error';
    return false;
  }
  if (newPass !== confirmPass) {
    msgEl.textContent = 'كلمتا المرور غير متطابقتين';
    msgEl.className = 'msg show error';
    return false;
  }

  btn.disabled = true; btn.textContent = '...جاري الحفظ';

  try {
    const res = await fetch(`${API_BASE}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: newPass }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || 'صار خطأ');

    showSuccess();
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.className = 'msg show error';
    btn.disabled = false;
    btn.textContent = 'تغيير كلمة المرور';
  }
  return false;
}

if (!token) {
  showInvalidToken();
} else {
  showForm();
}
</script>

</body>
</html>
